services:
  app:
    build:
      context: ../
      dockerfile: ./build/package/Dockerfile.prod
      args:
        TARGET_BIN: opspulse
    container_name: opspulse-app
    profiles:
      - app
    restart: unless-stopped
    env_file:
      - ../.env
    working_dir: /app
    volumes:
      - ./log:/app/log
      - ./target:/app/target

  api:
    build:
      context: ../
      dockerfile: ./build/package/Dockerfile.prod
      args:
        TARGET_BIN: api
    container_name: opspulse-api
    profiles:
      - api
    restart: unless-stopped
    ports:
      - 3333:3333
    env_file:
      - ../.env
    volumes:
      - ./log:/api/log
      - ./target:/api/target

  vite:
    build:
      context: ../web/opspulse-frontend
      dockerfile: ../../build/package/vite/Dockerfile.prod
    container_name: vite_app
    profiles:
      - api
      - frontend
    ports:
      - "5174:5173"
    volumes:
      - /app/node_modules
    environment:
      - WATCHPACK_POLLING=true
