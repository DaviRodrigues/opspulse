name: CI/CD Pipeline

on:
  push:
    branches: ["dev", "master"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["dev", "master"]

permissions:
  contents: write

env:
  GO_VERSION: "1.24.5"

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Go runtime
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          check-latest: true
          cache: true
      
      # validar depois a versão do go, aqui ainda está na 1.23
      # - name: Run golangci-lint
      #   uses: golangci/golangci-lint-action@v6
      #   with:
      #     version: v1.60

      - name: Install dependencies
        run: go mod download && go mod verify

      - name: Run unit tests with race detector and coverage
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

  release:
    name: Build and Release Binaries
    needs: lint-and-test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Go runtime
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Build Binaries for Linux and Windows
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/opspulse-linux-amd64 ./cmd/opspulse
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/opspulse-windows-amd64.exe ./cmd/opspulse

      - name: Upload Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          prerelease: false